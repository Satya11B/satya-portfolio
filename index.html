<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Over</title>
<style>
:root{
  --ink:#050A1C;
  --navy:#0A1836;
  --navy-2:#122653;
  --cyan:#2FD8E0;
  --gold:#FFC93C;
  --red:#FF3B47;
  --lime:#6EE787;
  --chalk:#EEF4FF;
  --turf:#2E8B4F;
  --turf-2:#27793F;
  --clay:#CBA971;
  --display:'Haettenschweiler','Arial Narrow Bold',Impact,'Franklin Gothic Heavy',system-ui,sans-serif;
  --body:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--body);
  color:var(--chalk);
  background:radial-gradient(120% 90% at 50% 0%,#1B2E63 0%,#0B1633 45%,var(--ink) 100%);
  min-height:100svh;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(6px,1.8vw,20px);
  overflow-x:hidden;-webkit-text-size-adjust:100%;
}
.stage{width:min(760px,100%);display:flex;flex-direction:column;gap:clamp(6px,1.4vw,11px)}

/* ---------------- broadcast bar ---------------- */
.broadcast{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:clamp(5px,1.4vw,14px);
  padding:clamp(7px,1.6vw,12px) clamp(9px,2vw,16px);
  background:linear-gradient(180deg,#15295A 0%,#08122E 100%);
  border:1px solid rgba(47,216,224,.22);
  border-radius:8px;
  box-shadow:0 14px 36px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);
  position:relative;
}
.side{display:flex;flex-direction:column;gap:1px;min-width:0}
.side.away{align-items:flex-end;text-align:right}
.sname{
  font-family:var(--display);font-size:clamp(11px,2.9vw,17px);
  letter-spacing:.11em;text-transform:uppercase;color:var(--cyan);
}
.side.away .sname{color:#FF9BA3}
.side.batting .sname::after{content:" ●";color:var(--gold);font-size:.8em}
.sruns{
  font-family:var(--display);font-size:clamp(26px,7.6vw,46px);line-height:.88;
  color:var(--chalk);font-variant-numeric:tabular-nums;transform:skewX(-6deg);
}
.sruns.bump{animation:bump 420ms ease-out}
@keyframes bump{0%,100%{transform:skewX(-6deg) scale(1)}45%{transform:skewX(-6deg) scale(1.24);color:var(--gold)}}
.smeta{font-size:clamp(9px,2.2vw,11px);color:rgba(238,244,255,.58)}
.ctr{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:0 clamp(4px,1.4vw,10px);
  border-left:1px solid rgba(47,216,224,.16);border-right:1px solid rgba(47,216,224,.16);
  min-width:clamp(78px,22vw,150px);
}
.ctr .big{font-family:var(--display);font-size:clamp(13px,3.2vw,20px);letter-spacing:.05em;text-transform:uppercase;text-align:center}
.ctr .sub{font-size:clamp(9px,2.1vw,11px);color:var(--gold);text-align:center}
.mute{
  position:absolute;top:5px;right:6px;
  background:none;border:1px solid rgba(47,216,224,.3);color:rgba(238,244,255,.75);
  border-radius:5px;font-size:11px;line-height:1;padding:3px 5px;cursor:pointer;
}
.mute:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.chase{
  text-align:center;font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;
  font-size:clamp(12px,3.2vw,18px);color:var(--gold);
  padding:5px;border-radius:6px;background:rgba(255,201,60,.09);
  border:1px solid rgba(255,201,60,.24);
}
.chase.hot{color:var(--red);background:rgba(255,59,71,.12);border-color:rgba(255,59,71,.3)}

/* ---------------- ground ---------------- */
.ground{
  position:relative;width:100%;aspect-ratio:5/4;
  border-radius:10px;overflow:hidden;
  border:1px solid rgba(47,216,224,.15);
  box-shadow:0 20px 56px rgba(0,0,0,.6);
  background:linear-gradient(180deg,#241A4E 0%,#4A2A63 34%,#8E4A54 54%,#D9743C 64%,#2A1F42 66%,#150F2C 100%);
}
@media (max-aspect-ratio:3/4){.ground{aspect-ratio:1/1}}

.stands{
  position:absolute;left:-6%;right:-6%;top:10%;height:34%;
  background:linear-gradient(180deg,#1A1436 0%,#241B45 70%,#171130 100%);
  border-radius:50%/40% 40% 14% 14%;
  box-shadow:inset 0 -14px 26px rgba(0,0,0,.6);
  overflow:hidden;
}
.fan{position:absolute;width:.9%;aspect-ratio:1;border-radius:50%;opacity:.7}
.stands.roar .fan{animation:hop 620ms ease-in-out}
@keyframes hop{50%{transform:translateY(-40%) scale(1.3)}}
.stands.hush .fan{animation:hush 800ms ease-in-out}
@keyframes hush{50%{transform:translateY(14%);opacity:.25}}

.pylon{position:absolute;top:2%;width:14%;height:15%}
.pylon.l{left:3%}.pylon.r{right:3%}
.pylon i{
  position:absolute;top:0;left:0;right:0;height:34%;
  background:linear-gradient(180deg,#FDFEFF,#BFD8FF);
  border-radius:3px;box-shadow:0 0 26px 9px rgba(190,225,255,.5);
}
.pylon::after{content:"";position:absolute;left:46%;top:30%;width:8%;height:74%;background:rgba(180,205,255,.35)}
.beam{
  position:absolute;top:4%;width:44%;height:70%;pointer-events:none;
  background:linear-gradient(180deg,rgba(200,230,255,.22),rgba(200,230,255,0) 80%);
  filter:blur(9px);
}
.beam.l{left:-2%;clip-path:polygon(30% 0,46% 0,100% 100%,4% 100%)}
.beam.r{right:-2%;clip-path:polygon(54% 0,70% 0,96% 100%,0 100%)}

.oval{
  position:absolute;left:4%;right:4%;top:22%;bottom:1%;
  border-radius:50%;
  background:
    repeating-radial-gradient(circle at 50% 50%,var(--turf) 0 4.4%,var(--turf-2) 4.4% 8.8%),
    var(--turf);
  box-shadow:inset 0 0 60px rgba(0,0,0,.45),0 0 0 clamp(3px,.8vw,6px) #E9F1FF;
}
.oval::after{
  content:"";position:absolute;left:12%;right:12%;top:14%;bottom:14%;
  border:2px dashed rgba(255,255,255,.3);border-radius:50%;
}
.hilite{
  position:absolute;left:4%;right:4%;top:22%;bottom:1%;border-radius:50%;
  background:radial-gradient(60% 45% at 50% 8%,rgba(255,255,255,.16),transparent 70%);
  pointer-events:none;
}

.pitch{
  position:absolute;left:43%;right:43%;top:30%;bottom:12%;
  background:linear-gradient(180deg,#BE9A61 0%,var(--clay) 40%,#D8BC85 100%);
  clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);
  box-shadow:inset 0 0 22px rgba(120,86,40,.5);
}
.crease{position:absolute;left:38%;right:38%;height:2px;background:rgba(255,255,255,.75)}
.crease.top{top:32%}
.crease.bot{left:30%;right:30%;top:78%}

.stumps{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:14%;width:5%;height:6%;z-index:3}
.stumps.far{top:28.5%;width:3.4%;height:4.2%}
.stumps.near{top:76%;width:5.4%;height:7%}
.stumps b{flex:1;background:linear-gradient(180deg,#FFF9E8,#D9C48F);border-radius:1px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.stumps.out{animation:clatter 640ms ease-out forwards}
@keyframes clatter{to{transform:translateX(-50%) rotate(34deg) translate(16%,26%);opacity:.85}}

.person{position:absolute;transform:translate(-50%,-92%);z-index:4}
.fig{display:block;width:100%;height:100%;overflow:visible}
.fig .limb{transform-box:fill-box}
.fig .leg{transform-origin:50% 3%}
.fig .arm{transform-origin:50% 6%}
.fig .bat{transform-box:fill-box;transform-origin:50% 16%}

/* stride cycle for anyone on the move */
.running .fig .leg.back{animation:stride 320ms linear infinite}
.running .fig .leg.front{animation:stride 320ms linear infinite reverse}
.running .fig .arm.back{animation:swingarm 320ms linear infinite reverse}
.running .fig .arm.front{animation:swingarm 320ms linear infinite}
@keyframes stride{0%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}100%{transform:rotate(-30deg)}}
@keyframes swingarm{0%{transform:rotate(24deg)}50%{transform:rotate(-24deg)}100%{transform:rotate(24deg)}}

.bowler{left:50%;top:24%;width:5%;height:9.5%;
  transition:top 620ms cubic-bezier(.4,.1,.7,1),transform 200ms ease}
.bowler.delivering{transform:translate(-50%,-92%) scale(1.06) rotate(-6deg)}
.bowler.delivering .fig .arm.front{animation:windmill 460ms cubic-bezier(.35,.05,.6,1) 1 forwards}
.bowler.delivering .fig .arm.back{animation:none;transform:rotate(-34deg)}
.bowler.delivering .fig .leg.front{animation:none;transform:rotate(42deg)}
.bowler.delivering .fig .leg.back{animation:none;transform:rotate(-34deg)}
@keyframes windmill{from{transform:rotate(-172deg)}to{transform:rotate(38deg)}}

.batter{left:44%;top:77%;width:5.6%;height:10.5%;transition:transform 180ms ease}
.batter .fig .bat{transform:rotate(18deg);transition:transform 190ms cubic-bezier(.3,1.5,.5,1)}
.batter .fig .arm.front{transform:rotate(-14deg)}
.batter .fig .arm.back{transform:rotate(14deg)}
.batter.swing{transform:translate(-50%,-92%) rotate(-13deg)}
.batter.swing .fig .bat{transform:rotate(-146deg)}
.batter.swing .fig .arm.front{transform:rotate(-52deg)}
.batter.swing .fig .arm.back{transform:rotate(-28deg)}

.keeper{left:50%;top:91%;width:5.4%;height:9%}
.keeper .fig .leg{transform:rotate(0)}
.keeper .fig .leg.back{transform:rotate(-24deg)}
.keeper .fig .leg.front{transform:rotate(24deg)}
.keeper .fig .arm.front{transform:rotate(-30deg)}
.keeper .fig .arm.back{transform:rotate(30deg)}

.fielder{
  position:absolute;width:3.6%;height:7%;
  transform:translate(-50%,-92%);
  transition:left 420ms ease,top 420ms ease,transform 260ms ease,filter 200ms ease;
  z-index:3;
}
.fielder .fig .arm.back{transform:rotate(18deg)}
.fielder .fig .arm.front{transform:rotate(-18deg)}
.fielder.active{transform:translate(-50%,-92%) scale(1.45);filter:drop-shadow(0 0 7px var(--gold))}
.fielder.active .fig .arm.front{transform:rotate(-158deg)}
.fielder.active .fig .arm.back{transform:rotate(158deg)}

.ball{
  position:absolute;left:50%;top:29%;width:2.4%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#FF8A6B 0 38%,#C42A1F 39% 100%);
  box-shadow:0 0 10px rgba(255,90,60,.6),inset -2px -2px 4px rgba(0,0,0,.4);
  transform:translate(-50%,-50%) scale(1);
  z-index:6;opacity:0;
}
.ball.live{opacity:1}
.ball.move{transition:left var(--t,500ms) cubic-bezier(.32,.5,.45,1),top var(--t,500ms) cubic-bezier(.32,.5,.45,1),transform var(--t,500ms) ease-out}

.trail{position:absolute;inset:0;z-index:5;pointer-events:none}
.trail svg{width:100%;height:100%}
.trail path{fill:none;stroke:var(--gold);stroke-width:.6;stroke-linecap:round;opacity:.85;
  stroke-dasharray:200;stroke-dashoffset:200;transition:stroke-dashoffset 620ms ease-out}
.trail.on path{stroke-dashoffset:0}

.shout{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);
  font-family:var(--display);font-size:clamp(30px,10.5vw,78px);
  letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;
  opacity:0;pointer-events:none;z-index:9;
  text-shadow:0 5px 0 rgba(0,0,0,.5),0 0 34px currentColor;
}
.shout.show{animation:pop 1300ms cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-5deg)}
  16%{opacity:1;transform:translate(-50%,-50%) scale(1.14) rotate(-3deg)}
  28%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
  76%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
  100%{opacity:0;transform:translate(-50%,-54%) scale(1.05) rotate(-3deg)}
}
.wash{position:absolute;inset:0;z-index:8;opacity:0;pointer-events:none;transition:opacity 240ms ease}
.wash.on{opacity:.3}

/* ---------------- over ticker ---------------- */
.overstrip{display:flex;align-items:center;gap:clamp(4px,1.2vw,7px);flex-wrap:wrap;justify-content:center;min-height:clamp(26px,6vw,34px)}
.chip{
  font-family:var(--display);font-size:clamp(12px,3vw,17px);
  width:clamp(24px,6vw,32px);height:clamp(24px,6vw,32px);
  display:grid;place-items:center;border-radius:50%;
  background:rgba(238,244,255,.08);border:1.5px solid rgba(238,244,255,.22);
  color:rgba(238,244,255,.6);
}
.chip.r1,.chip.r2,.chip.r3{color:var(--chalk);border-color:rgba(238,244,255,.5)}
.chip.r4{background:var(--cyan);border-color:var(--cyan);color:var(--ink)}
.chip.r6{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.chip.w{background:var(--red);border-color:var(--red);color:#fff}
.chip.x{background:rgba(255,201,60,.2);border-color:var(--gold);color:var(--gold);font-size:.72em}
.chip.now{animation:chipIn 320ms cubic-bezier(.2,1.5,.4,1)}
@keyframes chipIn{from{transform:scale(.3);opacity:0}}

/* ---------------- controls ---------------- */
.panel{display:flex;flex-direction:column;gap:clamp(5px,1.3vw,9px)}
.row{display:flex;align-items:center;gap:clamp(5px,1.3vw,9px)}
.rowlab{
  font-family:var(--display);font-size:clamp(10px,2.4vw,13px);letter-spacing:.09em;
  text-transform:uppercase;color:rgba(47,216,224,.85);width:clamp(46px,13vw,72px);flex:none;
}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(4px,1.1vw,7px);flex:1}
.opt{
  font-family:var(--body);font-weight:700;
  font-size:clamp(10px,2.5vw,13px);
  color:rgba(238,244,255,.72);
  background:rgba(18,38,83,.85);
  border:1.5px solid rgba(47,216,224,.2);
  border-radius:7px;padding:clamp(7px,1.8vw,11px) 2px;
  cursor:pointer;transition:background 140ms ease,color 140ms ease,border-color 140ms ease,transform 90ms ease;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;line-height:1.15;
}
.opt:hover:not(:disabled):not(.on){border-color:rgba(47,216,224,.5)}
.opt.on{background:linear-gradient(180deg,#3FE7EF,#16A9B4);color:var(--ink);border-color:#7FF3F8}
.opt:active:not(:disabled){transform:translateY(2px)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.go{
  font-family:var(--display);font-size:clamp(17px,4.6vw,25px);
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  background:linear-gradient(180deg,#FFE083,var(--gold) 55%,#D89A05);
  border:none;border-radius:9px;padding:clamp(12px,2.8vw,17px);width:100%;
  cursor:pointer;box-shadow:0 5px 0 #9E6F04,0 12px 24px rgba(0,0,0,.45);
  transition:transform 100ms ease,box-shadow 100ms ease,filter 150ms ease;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.go:hover:not(:disabled){filter:brightness(1.06)}
.go:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #9E6F04}
.go:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 5px 0 rgba(158,111,4,.45)}
.go:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.tip{text-align:center;font-size:clamp(10px,2.3vw,12px);color:rgba(238,244,255,.5);min-height:2.6em;line-height:1.3;max-width:60ch;margin:0 auto}

/* ---------------- finale ---------------- */
.finale{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:18px;background:rgba(3,7,20,.88);backdrop-filter:blur(6px)}
.finale[hidden]{display:none}
.card{
  width:min(430px,100%);text-align:center;padding:clamp(20px,5vw,32px);
  border-radius:13px;background:linear-gradient(180deg,#16295C,#060E24);
  border:1px solid rgba(255,201,60,.34);box-shadow:0 30px 80px rgba(0,0,0,.7);
  animation:rise 420ms cubic-bezier(.2,1.2,.4,1);
}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.96)}}
.verdict{font-family:var(--display);font-size:clamp(28px,8.6vw,46px);letter-spacing:.04em;
  text-transform:uppercase;line-height:.96;color:var(--gold)}
.margin{font-size:clamp(12px,3vw,15px);color:rgba(238,244,255,.75);margin:6px 0 14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.mini{background:rgba(47,216,224,.08);border:1px solid rgba(47,216,224,.2);border-radius:8px;padding:10px}
.mini b{display:block;font-family:var(--display);font-size:clamp(22px,6vw,30px);color:var(--chalk);
  transform:skewX(-6deg);font-variant-numeric:tabular-nums;line-height:1}
.mini span{font-size:clamp(9px,2.3vw,11px);color:rgba(238,244,255,.6)}
.again{
  font-family:var(--display);font-size:clamp(16px,4.4vw,22px);letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink);background:linear-gradient(180deg,#9BF0AE,var(--lime) 60%,#33A85A);
  border:none;border-radius:9px;padding:14px;width:100%;cursor:pointer;
  box-shadow:0 5px 0 #218041,0 12px 22px rgba(0,0,0,.45);transition:transform 100ms ease,box-shadow 100ms ease;
}
.again:active{transform:translateY(4px);box-shadow:0 1px 0 #218041}
.again:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .stands.roar .fan,.stands.hush .fan{animation:none}
  .card{animation:none}
  .bowler{transition-duration:200ms}
}
</style>
</head>
<body>

<main class="stage">

  <header class="broadcast">
    <div class="side home" id="homeSide">
      <span class="sname">You</span>
      <span class="sruns" id="homeRuns">0-0</span>
      <span class="smeta" id="homeMeta">yet to bat</span>
    </div>
    <div class="ctr">
      <span class="big" id="ctrBig">Super Over</span>
      <span class="sub" id="ctrSub">You bat first</span>
    </div>
    <div class="side away" id="awaySide">
      <span class="sname">Rivals</span>
      <span class="sruns" id="awayRuns">0-0</span>
      <span class="smeta" id="awayMeta">yet to bat</span>
    </div>
    <button class="mute" id="mute" aria-pressed="false" title="Toggle sound">Sound on</button>
  </header>

  <p class="chase" id="chase">Six balls, two wickets. Make them count.</p>

  <div class="ground" id="ground">
    <div class="stands" id="stands"></div>
    <div class="beam l"></div><div class="beam r"></div>
    <div class="pylon l"><i></i></div>
    <div class="pylon r"><i></i></div>

    <div class="oval"></div>
    <div class="hilite"></div>

    <div class="pitch">
      <div class="crease top"></div>
      <div class="crease bot"></div>
    </div>

    <div class="stumps far" id="stumpsFar"><b></b><b></b><b></b></div>
    <div class="stumps near" id="stumpsNear"><b></b><b></b><b></b></div>

    <div class="person bowler" id="bowler"></div>
    <div class="person batter" id="batter"></div>
    <div class="person keeper" id="keeper"></div>

    <div class="trail" id="trail"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path id="trailPath" d=""></path></svg></div>
    <div class="ball" id="ball"></div>
    <div class="wash" id="wash"></div>
    <div class="shout" id="shout"></div>
  </div>

  <div class="overstrip" id="overstrip" aria-label="This over"></div>

  <section class="panel" id="panel"></section>
  <p class="tip" id="tip"></p>
  <p class="sr" id="live" role="status" aria-live="polite"></p>
</main>

<div class="finale" id="finale" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="verdict">
    <p class="verdict" id="verdict">You win</p>
    <p class="margin" id="margin"></p>
    <div class="cards">
      <div class="mini"><b id="fHome">0-0</b><span>Your total</span></div>
      <div class="mini"><b id="fAway">0-0</b><span>Rivals</span></div>
    </div>
    <button class="again" id="again">Play again</button>
  </div>
</div>

<script>
(function(){
"use strict";

var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============ audio ============ */
var AC = null, muted = false;
function ctx(){
  if(!AC){
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    AC = new C();
  }
  if(AC.state === "suspended") AC.resume();
  return AC;
}
function noiseBuf(a, secs){
  var n = Math.floor(a.sampleRate * secs), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for(var i=0;i<n;i++) d[i] = Math.random()*2-1;
  return b;
}
function env(a, node, peak, attack, decay){
  var g = a.createGain(), t = a.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  node.connect(g); g.connect(a.destination);
  return t + attack + decay;
}
function burst(freqHi, freqLo, secs, peak, attack, decay){
  var a = ctx(); if(!a || muted) return;
  var s = a.createBufferSource(); s.buffer = noiseBuf(a, secs);
  var f = a.createBiquadFilter(); f.type = "bandpass";
  f.frequency.value = freqHi; f.Q.value = freqLo;
  s.connect(f);
  var end = env(a, f, peak, attack, decay);
  s.start(); s.stop(end + 0.05);
}
function tone(freq, secs, type, peak){
  var a = ctx(); if(!a || muted) return;
  var o = a.createOscillator(); o.type = type || "sine"; o.frequency.value = freq;
  var end = env(a, o, peak || 0.25, 0.006, secs);
  o.start(); o.stop(end + 0.05);
}

  {n:"cover",       s:"off",      x:22, y:42},

function setField(plan){
  // Stack the side the bowling plan attacks, keep it imperfect so it reads as a hint, not a tell.
  var offWeight = plan.line === "off" ? 6 : plan.line === "leg" ? 3 : 4;
  if(plan.length === "short") offWeight -= 1;
  var off = SPOTS.filter(function(s){ return s.s === "off"; });
  var leg = SPOTS.filter(function(s){ return s.s === "leg"; });
  var str = SPOTS.filter(function(s){ return s.s === "straight"; });
  shuffle(off); shuffle(leg); shuffle(str);
  var pick = off.slice(0, offWeight).concat(leg.slice(0, 8 - offWeight)).concat(str.slice(0, 1));
  while(pick.length < 9) pick.push(SPOTS[(Math.random()*SPOTS.length)|0]);
  currentField = pick.slice(0, 9);
  currentField.forEach(function(s, i){
    fielderEls[i].classList.remove("active");
    fielderEls[i].style.left = (s.x + (Math.random()*4-2)).toFixed(1) + "%";
    fielderEls[i].style.top = (s.y + (Math.random()*4-2)).toFixed(1) + "%";
    fielderEls[i].title = s.n;
  });
}
function fieldDensity(dir){
  var n = 0;
  currentField.forEach(function(s){ if(s.s === dir) n++; });
  return n / 9;
}
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0, t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

var LINES = ["off","stumps","leg"];
var LENGTHS = ["short","good","full"];
var TYPES = ["pace","slower","cutter"];
var DIRS = ["off","straight","leg"];
var TIMINGS = ["early","perfect","late"];

/* ============ AI ============ */
function pickW(items, weights){
  var t = 0, i;
  for(i=0;i<weights.length;i++) t += weights[i];
  var r = Math.random()*t, a = 0;
  for(i=0;i<weights.length;i++){ a += weights[i]; if(r < a) return items[i]; }
  return items[items.length-1];
}

function aiBowlPlan(){
  var side = batting();
  var ballsLeft = 6 - side.balls;
  var need = S.target ? S.target - side.runs : null;
  var pressure = need !== null && ballsLeft > 0 ? need / ballsLeft : 1.6;
  // Under pressure the AI goes to the blockhole more often.
  var lenW = pressure > 2.4 ? [0.22,0.28,0.50] : [0.28,0.42,0.30];
  var typW = pressure > 2.4 ? [0.42,0.34,0.24] : [0.50,0.26,0.24];
  return {
    line: pickW(LINES, [0.38,0.40,0.22]),
    length: pickW(LENGTHS, lenW),
    type: pickW(TYPES, typW)
  };
}

function aiBatShot(){
  var side = batting();
  var ballsLeft = 6 - side.balls;
  var need = S.target ? S.target - side.runs : null;
  var pressure = need !== null && ballsLeft > 0 ? need / ballsLeft : 1.8;
  // Reads the field a little: favours the emptier side.
  var offD = fieldDensity("off"), legD = fieldDensity("leg");
  var dw = [0.33 + (legD - offD) * 0.30, 0.30, 0.33 + (offD - legD) * 0.30];
  dw = dw.map(function(v){ return Math.max(0.08, v); });
  var tw = pressure > 2.6 ? [0.30,0.44,0.26] : pressure < 1.2 ? [0.20,0.52,0.28] : [0.25,0.48,0.27];
  return { dir: pickW(DIRS, dw), timing: pickW(TIMINGS, tw), swinging: pressure > 2.6 };
}

/* ============ ball resolution ============ */
function clamp(v,a,b){ return v < a ? a : v > b ? b : v; }

// Each delivery type beats one timing and is handled well by another.
// Swing early and the slower ball has you through the shot. Play late and raw pace rushes you.
// Meet it dead straight and the cutter grips past the edge.
var COUNTER = { early:"slower", perfect:"cutter", late:"pace" };
var HANDLES = { early:"pace",   perfect:"slower", late:"cutter" };

function resolveBall(p, shot){
  var yorker = p.length === "full" && p.type === "pace";

  // Extras
  var exChance = 0.045 + (yorker ? 0.035 : 0) + (p.line === "leg" ? 0.025 : 0);
  if(Math.random() < exChance){
    var noBall = Math.random() < 0.35;
    return { extra:true, runs:1, kind: noBall ? "noball" : "wide",
             label: noBall ? "No ball!" : "Wide!",
             say: noBall ? "No ball, one run and it comes again" : "Wide down the side" };
  }

  // Timing is a risk dial, and each variation beats exactly one of the three.
  var t = shot.timing;
  var q = t === "early" ? 0.74 : t === "perfect" ? 0.68 : 0.52;
  var risk = t === "early" ? 1.7 : t === "perfect" ? 1.0 : 0.6;
  var beaten = false;
  if(COUNTER[t] === p.type){ q -= 0.30; risk *= 1.5; beaten = true; }
  else if(HANDLES[t] === p.type){ q += 0.10; }

  if(p.length === "short" && shot.dir === "leg") q += 0.11;
  if(p.length === "short" && shot.dir === "straight") q -= 0.11;
  if(p.length === "full" && shot.dir === "straight") q += 0.09;
  if(p.length === "full" && shot.dir === "leg") q -= 0.07;
  if(p.length === "good" && shot.dir === "off") q += 0.05;
  if(p.line === "off" && shot.dir === "leg") q -= 0.15;
  if(p.line === "leg" && shot.dir === "off") q -= 0.13;
  if(p.line === "off" && shot.dir === "off") q += 0.07;
  if(p.line === "leg" && shot.dir === "leg") q += 0.07;
  if(p.line === "stumps" && shot.dir === "straight") q += 0.06;
  if(yorker) q -= 0.11;
  if(shot.swinging) q += 0.04;

  q += (Math.random() - 0.5) * 0.14;
  q = clamp(q, 0.05, 1);

  // Wicket
  var wick = (0.045 + (1 - q) * 0.17) * risk;
  if(yorker) wick += 0.03;
  if(p.line === "stumps") wick += 0.02;
  if(shot.swinging) wick += 0.025;
  wick = clamp(wick, 0.015, 0.36);

  if(Math.random() < wick){
    var how;
    if(p.length === "full" && p.line === "stumps") how = Math.random() < 0.55 ? "Bowled!" : "LBW!";
    else if(p.type !== "pace" && t === "early") how = Math.random() < 0.4 ? "Stumped!" : "Caught!";
    else how = Math.random() < 0.82 ? "Caught!" : "Bowled!";
    return { wicket:true, runs:0, kind:"W", label:"Wicket!", how:how, beaten:beaten,
             aerial: how === "Caught!", dir: shot.dir,
             say: how.replace("!","") + (beaten ? ", the change of pace did it" : ", that is the end of that") };
  }

  // Runs
  var dens = fieldDensity(shot.dir);
  var w;
  if(q >= 0.74)      w = [0.05, 0.17, 0.10, 0.36, 0.32];
  else if(q >= 0.58) w = [0.12, 0.30, 0.16, 0.30, 0.12];
  else if(q >= 0.44) w = [0.27, 0.38, 0.18, 0.14, 0.03];
  else               w = [0.47, 0.36, 0.11, 0.06, 0.00];
  if(dens > 0.40){ var cut = (w[3] + w[4]) * 0.34; w[3] *= 0.66; w[4] *= 0.66; w[1] += cut*0.6; w[2] += cut*0.4; }
  if(dens < 0.25){ w[3] *= 1.22; w[4] *= 1.18; }

  var runs = pickW([0,1,2,4,6], w);
  var labels = {0:"Dot ball!", 1:"Single", 2:"Two runs", 4:"FOUR!", 6:"SIX!"};
  var says = {
    0: q < 0.45 ? "Beaten, no run" : "Dug out, no run",
    1:"Pushed away for one", 2:"Well run, two",
    4:"Races away to the rope", 6:"That is out of the ground"
  };
  if(runs === 0 && beaten) says[0] = "Wrong pace, nowhere near it";
  return { runs:runs, kind:String(runs), label:labels[runs], say:says[runs],
           dir:shot.dir, aerial: runs >= 4, beaten: runs === 0 && (beaten || q < 0.45) };
}

function playBall(p, shot, out, done){
  var T = reduced ? 0.42 : 1;
  var runUp = Math.round(620*T), flight = Math.round(470*T), after = Math.round(620*T);

  el.trail.classList.remove("on");
  el.stumpsNear.classList.remove("out");
  fielderEls.forEach(function(f){ f.classList.remove("active"); });
  el.ball.classList.remove("live","move");
  setBall(50, 26, 0.7, 0);

  // run-up
  el.bowler.style.top = "22%";
  el.bowler.classList.add("running");
  requestAnimationFrame(function(){ el.bowler.style.top = "31%"; });

  setTimeout(function(){
    el.bowler.classList.remove("running");
    el.bowler.classList.add("delivering");
    el.ball.classList.add("live","move");
    var drift = p.line === "off" ? -3.5 : p.line === "leg" ? 3.5 : 0;
    setBall(50 + drift, 71, 1.25, flight);
  }, runUp);

  // impact
  setTimeout(function(){
    el.bowler.classList.remove("delivering");
    el.bowler.style.top = "22%";

    if(out.extra){
      sfx.glove();
      setBall(out.kind === "wide" ? 66 : 50, 88, 0.9, after);
      shout(out.label, "#FFC93C");
      crowd("hush");
      return;
    }

    el.batter.classList.add("swing");
    setTimeout(function(){ el.batter.classList.remove("swing"); }, Math.round(260*T));

    if(out.wicket){
      if(out.how === "Bowled!" || out.how === "Stumped!"){
        el.stumpsNear.classList.add("out");
        sfx.wicket();
        setBall(50, 78, 0.8, Math.round(200*T));
      } else if(out.how === "LBW!"){
        sfx.pad(); setTimeout(sfx.wicket, 120);
        setBall(50, 76, 0.9, Math.round(200*T));
      } else {
        sfx.bat();
        var f = nearestFielder(out.dir);
        setBall(f.x, f.y, 0.55, after);
        setTimeout(function(){ f.node.classList.add("active"); sfx.wicket(); }, after);
      }
      shout(out.how, "#FF3B47");
      wash("#FF3B47");
      crowd("roar");
      return;
    }

    var runs = out.runs;
    if(runs === 0){
      if(out.beaten){ sfx.glove(); crowd("hush"); }
      else { sfx.pad(); }
      setBall(lerp(BAT_POS.x, SECTOR[out.dir].x, 0.18), lerp(BAT_POS.y, SECTOR[out.dir].y, 0.18), 0.9, after);
      shout(out.beaten ? "Beaten!" : "Dot ball!", "#9FB4E8");
      return;
    }

    sfx.bat();
    var frac = runs === 1 ? 0.46 : runs === 2 ? 0.68 : runs === 4 ? 1.0 : 1.14;
    var dest = { x: lerp(BAT_POS.x, SECTOR[out.dir].x, frac), y: lerp(BAT_POS.y, SECTOR[out.dir].y, frac) };
    drawTrail(dest);
    setBall(dest.x, dest.y, runs >= 6 ? 0.4 : runs === 4 ? 0.6 : 0.75, after);

    if(runs >= 4){
      shout(out.label, runs === 6 ? "#FFC93C" : "#2FD8E0");
      wash(runs === 6 ? "#FFC93C" : "#2FD8E0");
      crowd("roar");
      setTimeout(function(){ sfx.roar(runs === 6); }, 180);
    } else {
      var f2 = nearestFielder(out.dir);
      setTimeout(function(){ f2.node.classList.add("active"); }, after - 120);
      shout(out.label, "#EEF4FF");
    }
  }, runUp + flight);

  setTimeout(done, runUp + flight + after + Math.round(520*T));
}

function nearestFielder(dir){
  var best = null, bestD = 1e9, target = SECTOR[dir];
  currentField.forEach(function(s, i){
    var d = Math.pow(s.x - target.x, 2) + Math.pow(s.y - target.y, 2);
    if(d < bestD){ bestD = d; best = { x:s.x, y:s.y, node:fielderEls[i] }; }
  });
  return best || { x:50, y:40, node:fielderEls[0] };
}

/* ============ flow ============ */
function deliver(){
  if(busy) return;
  busy = true;
  ctx(); // unlock audio on the first gesture
  setControlsDisabled(true);

  var p, shot;
  if(S.innings === 1){
    p = plan;                                   // AI's plan, already on the board
    shot = { dir: sel.dir, timing: sel.timing };
  } else {
    p = { line: sel.line, length: sel.length, type: sel.type };
    shot = aiBatShot();
  }

  var out = resolveBall(p, shot);
  var side = batting();

  playBall(p, shot, out, function(){
    applyOutcome(out, side);
  });
}

function applyOutcome(out, side){
  side.runs += out.runs;
  if(out.wicket) side.wkts++;
  if(!out.extra) side.balls++;
  side.log.push(out);

  var scorer = (S.innings === 1);
  (scorer ? el.homeRuns : el.awayRuns).classList.toggle("bump", out.runs >= 4);
  setTimeout(function(){ el.homeRuns.classList.remove("bump"); el.awayRuns.classList.remove("bump"); }, 450);

  el.live.textContent = out.label + " " + (out.say || "") + ". " +
    side.runs + " for " + side.wkts + ", " + Math.max(0, 6 - side.balls) + " balls left.";
  el.tip.textContent = out.say || "";

  render();

  // Did the innings just end?
  var done = side.balls >= 6 || side.wkts >= 2 ||
             (S.target !== null && side.runs >= S.target);

  if(done){
    setTimeout(endInnings, reduced ? 350 : 750);
  } else {
    busy = false;
    if(S.innings === 1){ plan = aiBowlPlan(); setField(plan); }
    setControlsDisabled(false);
    render();
  }
}

function endInnings(){
  if(S.innings === 1){
    S.target = S.home.runs + 1;
    S.innings = 2;
    shout("Target " + S.target, "#FFC93C");
    sfx.roar(false);
    dressFigures();
    setField({ line: sel.line, length: sel.length });
    busy = false;
    render();
    setControlsDisabled(false);
    return;
  }
  // second innings over
  if(S.away.runs === S.home.runs){
    // tie -> another super over
    S.superOver++;
    S.innings = 1;
    S.target = null;
    S.home = {runs:0, wkts:0, balls:0, log:[]};
    S.away = {runs:0, wkts:0, balls:0, log:[]};
    shout("Tied!", "#FF3B47");
    sfx.gasp();
    setTimeout(function(){
      dressFigures();
      plan = aiBowlPlan(); setField(plan);
      busy = false; render(); setControlsDisabled(false);
    }, reduced ? 400 : 1200);
    return;
  }
  finish();
}

function finish(){
  var youWin = S.home.runs > S.away.runs;
  el.verdict.textContent = youWin ? "You win" : "Rivals win";
  el.verdict.style.color = youWin ? "#6EE787" : "#FF3B47";
  var diff = Math.abs(S.home.runs - S.away.runs);
  el.margin.textContent = youWin
    ? "Defended the target by " + diff + (diff === 1 ? " run" : " runs") +
      (S.superOver > 1 ? ", in super over " + S.superOver + "." : ".")
    : "Chased it down with " + Math.max(0, 6 - S.away.balls) + " balls to spare" +
      (S.superOver > 1 ? ", in super over " + S.superOver + "." : ".");
  el.fHome.textContent = S.home.runs + "-" + S.home.wkts;
  el.fAway.textContent = S.away.runs + "-" + S.away.wkts;
  el.live.textContent = (youWin ? "You win. " : "Rivals win. ") + S.home.runs + " plays " + S.away.runs;
  if(youWin) sfx.win(); else sfx.gasp();
  el.finale.hidden = false;
  el.again.focus({preventScroll:true});
}

/* ============ controls ============ */
var GROUPS = {
  bat: [
    { key:"dir", label:"Shot", items:[["off","Off side"],["straight","Straight"],["leg","Leg side"]] },
    { key:"timing", label:"Timing", items:[["early","Early"],["perfect","Perfect"],["late","Late"]] }
  ],
  bowl: [
    { key:"line", label:"Line", items:[["off","Outside off"],["stumps","At the stumps"],["leg","Down leg"]] },
    { key:"length", label:"Length", items:[["short","Short"],["good","Good length"],["full","Full"]] },
    { key:"type", label:"Ball", items:[["pace","Express pace"],["slower","Slower ball"],["cutter","Off-cutter"]] }
  ]
};
var goBtn = null;

function buildPanel(){
  var mode = S.innings === 1 ? "bat" : "bowl";
  if(el.panel.dataset.mode === mode){ syncPanel(); return; }
  el.panel.dataset.mode = mode;
  el.panel.innerHTML = "";
  GROUPS[mode].forEach(function(g){
    var row = document.createElement("div"); row.className = "row";
    var lab = document.createElement("span"); lab.className = "rowlab"; lab.textContent = g.label;
    var seg = document.createElement("div"); seg.className = "seg";
    seg.setAttribute("role","group"); seg.setAttribute("aria-label", g.label);
    g.items.forEach(function(it){
      var b = document.createElement("button");
      b.type = "button"; b.className = "opt"; b.textContent = it[1];
      b.dataset.key = g.key; b.dataset.val = it[0];
      b.setAttribute("aria-pressed", String(sel[g.key] === it[0]));
      b.addEventListener("click", function(){
        if(busy) return;
        sel[g.key] = it[0];
        if(S.innings === 2) setField({ line: sel.line, length: sel.length });
        syncPanel();
      });
      seg.appendChild(b);
    });
    row.appendChild(lab); row.appendChild(seg);
    el.panel.appendChild(row);
  });
  goBtn = document.createElement("button");
  goBtn.type = "button"; goBtn.className = "go";
  goBtn.addEventListener("click", deliver);
  el.panel.appendChild(goBtn);
  syncPanel();
}
function syncPanel(){
  Array.prototype.forEach.call(el.panel.querySelectorAll(".opt"), function(b){
    var on = sel[b.dataset.key] === b.dataset.val;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", String(on));
  });
  if(goBtn) goBtn.textContent = S.innings === 1 ? "Face the ball" : "Bowl it";
}
function setControlsDisabled(on){
  Array.prototype.forEach.call(el.panel.querySelectorAll("button"), function(b){ b.disabled = on; });
}

/* ============ render ============ */
function chipFor(out){
  var c = document.createElement("span");
  c.className = "chip";
  if(out.extra){ c.classList.add("x"); c.textContent = out.kind === "wide" ? "wd" : "nb"; }
  else if(out.wicket){ c.classList.add("w"); c.textContent = "W"; }
  else { c.classList.add("r" + out.runs); c.textContent = out.runs === 0 ? "•" : out.runs; }
  c.title = out.label;
  return c;
}

function render(){
  var h = S.home, a = S.away;
  el.homeRuns.textContent = h.runs + "-" + h.wkts;
  el.awayRuns.textContent = a.runs + "-" + a.wkts;
  el.homeMeta.textContent = S.innings === 1 ? ballsPhrase(h) : (h.balls ? "innings closed" : "yet to bat");
  el.awayMeta.textContent = S.innings === 2 ? ballsPhrase(a) : "bowling";
  el.homeSide.classList.toggle("batting", S.innings === 1);
  el.awaySide.classList.toggle("batting", S.innings === 2);

  el.ctrBig.textContent = S.superOver > 1 ? "Super over " + S.superOver : "Super over";
  el.ctrSub.textContent = S.innings === 1 ? "You are batting" : "You are bowling";

  var side = batting();
  var left = Math.max(0, 6 - side.balls);
  if(S.innings === 1){
    el.chase.classList.remove("hot");
    el.chase.textContent = left + (left === 1 ? " ball left, " : " balls left, ") +
      (2 - h.wkts) + (2 - h.wkts === 1 ? " wicket in hand" : " wickets in hand");
  } else {
    var need = S.target - a.runs;
    el.chase.classList.toggle("hot", left > 0 && need / left > 2.5);
    el.chase.textContent = need <= 0 ? "Target reached!" :
      "Rivals need " + need + (need === 1 ? " run from " : " runs from ") +
      left + (left === 1 ? " ball" : " balls");
  }

  el.overstrip.innerHTML = "";
  side.log.forEach(function(o, i){
    var c = chipFor(o);
    if(i === side.log.length - 1) c.classList.add("now");
    el.overstrip.appendChild(c);
  });
  for(var i = side.log.filter(function(o){ return !o.extra; }).length; i < 6; i++){
    var e = document.createElement("span"); e.className = "chip"; e.textContent = "";
    el.overstrip.appendChild(e);
  }

  if(!side.log.length && !busy){
    el.tip.textContent = S.innings === 1
      ? "Slower ball beats an early swing. Express pace beats playing late. The cutter beats a perfect straight bat."
      : "Read their intent: slower ball for a premeditated swing, pace when they play late, cutter when they meet it straight.";
  }

  buildPanel();
}
function ballsPhrase(side){
  var left = Math.max(0, 6 - side.balls);
  return left + (left === 1 ? " ball left" : " balls left");
}

/* ============ boot ============ */
el.mute.addEventListener("click", function(){
  muted = !muted;
  el.mute.textContent = muted ? "Sound off" : "Sound on";
  el.mute.setAttribute("aria-pressed", String(muted));
  if(!muted) ctx();
});
el.again.addEventListener("click", function(){
  el.finale.hidden = true;
  start();
});
document.addEventListener("keydown", function(e){
  if(!el.finale.hidden) return;
  if((e.key === "Enter" || e.key === " ") && document.activeElement === document.body){
    e.preventDefault(); deliver();
  }
});

function start(){
  newMatch();
  if(!fielderEls.length) buildFielders();
  dressFigures();
  el.stumpsNear.classList.remove("out");
  el.ball.classList.remove("live");
  el.trail.classList.remove("on");
  plan = aiBowlPlan();
  setField(plan);
  render();
  setControlsDisabled(false);
}
start();
})();
</script>
